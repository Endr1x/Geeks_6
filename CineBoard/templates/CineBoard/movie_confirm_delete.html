{% extends 'CineBoard/base.html' %}

{% block content %}
<div class="card p-4 shadow-sm col-md-6 mx-auto text-center">
    <h3>Удаление фильма</h3>
    <p>Вы уверены, что хотите удалить фильм "<strong>{{ object.title }}</strong>"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'cineboard:movie_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
