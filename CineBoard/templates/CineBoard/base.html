<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CineBoard - Каталог Фильмов</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand font-weight-bold" href="{% url 'cineboard:movie_list' %}">🎬 CineBoard</a>
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="text-white me-3">Привет, {{ user.username }}!</span>
                    <a href="{% url 'cineboard:movie_add' %}" class="btn btn-success me-2">+ Добавить фильм</a>
                    <form method="post" action="{% url 'cineboard:logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light">Выход</button>
                    </form>
                {% else %}
                    <a href="{% url 'cineboard:login' %}" class="btn btn-outline-light me-2">Вход</a>
                    <a href="{% url 'cineboard:register' %}" class="btn btn-warning">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
