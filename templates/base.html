<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CineBoard — Каталог фильмов{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'cineboard:movie_list' %}">🎬 CineBoard</a>
    <div class="d-flex align-items-center">
      {% if user.is_authenticated %}
        <span class="navbar-text me-3 text-white">Привет, <strong>{{ user.username }}</strong></span>
        <a href="{% url 'cineboard:movie_add' %}" class="btn btn-sm btn-success me-2">+ Добавить фильм</a>
        <form action="{% url 'logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-light">Выйти</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-sm btn-outline-light me-2">Войти</a>
        <a href="{% url 'cineboard:signup' %}" class="btn btn-sm btn-warning">Регистрация</a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
