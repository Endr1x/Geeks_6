{% extends 'base.html' %}
{% block content %}
<div class="col-md-6 offset-md-3 text-center">
    <h3>Удалить фильм "{{ object.title }}"?</h3>
    <form method="post" class="mt-4">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'cineboard:movie_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
